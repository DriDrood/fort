version: "3"
services:
  frontend:
    build: frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx:/etc/nginx/conf.d
    restart: on-failure
    depends_on:
      - backend
  backend:
    build: Fort
    depends_on:
      - db
  db:
    image: "mariadb:10.3"
    volumes:
      - dbdata:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "makamakatoto68"
      MYSQL_USER: "fort"
      MYSQL_PASSWORD: "heblebletunato68"
    ports:
      - "3306:3306"
volumes:
    dbdata: