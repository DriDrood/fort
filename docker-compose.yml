version: "3"
services:
  web:
      build: app
      ports:
          - "80:8000"
      depends_on:
          - db
  db:
    image: "mariadb:10.3"
    volumes:
      - dbdata:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "makamakatoto68"
      MYSQL_USER: "fort"
      MYSQL_PASSWORD: "heblebletunato68"
    ports:
      - "3306:3306"
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_czech_ci']
volumes:
    dbdata: