version: "3"
services:
  web:
      build: app
      ports:
          - "80:8000"
      depends_on:
          - db
  db:
    image: "mariadb:10.3"
    volumes:
      - dbdata:/var/lib/mysql
    restart: on-failure
    environment:
      MYSQL_ROOT_PASSWORD: "makamakatoto68"
      MYSQL_USER: "fort"
      MYSQL_PASSWORD: "heblebletunato68"
    ports:
      - "3306:3306"
  redis:
    image: "redis:3.2"
    command: redis-server --requirepass Seheque32naTo --appendonly yes
    volumes:
      - "redisdata:/data"
    restart: on-failure
    environment:
      - REDIS_DISABLE_COMMANDS=FLUSHDB,FLUSHALL
    ports:
      - "6379:6379"
volumes:
    dbdata:
    redisdata:
    