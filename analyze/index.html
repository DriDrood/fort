<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Fort</title>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.2/css/all.css"
        integrity="sha384-oS3vJWv+0UjzBfQzYUhtDYW+Pj2yciDJxpsK1OYPAYjqT085Qq/1cq5FLXAZQ7Ay" crossorigin="anonymous">
    <style>
        * {
            color: inherit;
            border: none;
            background: transparent;
            text-decoration: none;
            font-size: inherit;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }

        body {
            position: relative;
        }

        nav {
            position: fixed;
            display: grid;
            width: 100%;
            height: 5rem;

            background: linear-gradient(170deg, #6f99acff 0%, #6f99ac60 100%);
            font-size: 2rem;

            grid-template-areas: "prev next avatar done time";
            grid-template-columns: 2fr 2fr 3fr 2fr 2fr;
            justify-items: center;
            align-items: center;

            z-index: 3;
        }

        nav img {
            grid-area: avatar;
            height: 140%;
            margin: -20% 0;
            border: 5px solid #000;
            border-radius: 50%;
        }

        nav .prev {
            grid-area: prev;
        }

        nav .next {
            grid-area: next;
        }

        nav .done {
            grid-area: done;
        }

        nav .time {
            grid-area: time;
        }

        .content {
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: #000;
        }

        .content .map {
            margin-top: 5rem;
            width: 1920px;
            height: 1024px;
            background: url('world.jpg') no-repeat;
            background-size: 100% 100%;
        }

        .content .map svg {
            width: 100%;
            height: 100%;
        }

        .modalContainer {
            position: absolute;
            display: grid;
            top: 0;
            width: 100%;
            height: 100%;

            background: #00000088;
            z-index: 2;

            justify-items: center;
            align-items: center;
        }

        .modalContainer .armySelect {
            display: grid;
            width: 80%;
            height: 30%;
            min-width: 20rem;
            min-height: 10rem;

            border-radius: 2rem;
            background: #507080;
            color: #fff;

            grid-row-gap: 10px;
            align-content: center;
            justify-items: center;
        }
        .modalContainer .armySelect h2 {
            font-size: 1.5rem;
        }

        .modalContainer .armySelect .selectRange {
            position: relative;
            width: 80%;
            height: 4px;
            margin: 20px 0;
            background: #bfc7cb;
        }
        .modalContainer .armySelect .selectRange .selectSlider {
            position: absolute;
            top: -8px;
            left: 22%;
            width: 10px;
            height: 20px;

            border-radius: 1rem;
            background: #bfc7cb;
        }

        .modalContainer .armySelect .count {
            display: grid;

            grid-template-areas: "amount incr""amount decr";
            justify-content: center;
            align-items: center;
            grid-column-gap: 5px;
        }

        .modalContainer .armySelect .count .amount {
            grid-area: amount;
            font-size: 1.2rem;
        }

        .modalContainer .armySelect .count .incr {
            grid-area: incr;
        }
        .modalContainer .armySelect .count .decr {
            grid-area: decr;
        }
    </style>
</head>

<body>
    <nav>
        <img src="av.jpg" alt="avatar" title="Samuel" />
        <button class="prev" title="Vrátit o kolo"><i class="fa fa-step-backward"></i></button>
        <button class="next" title="Vpřed o kolo"><i class="fa fa-step-forward"></i></button>
        <button class="done" title="Hotovo"><i class="fa fa-check"></i></button>
        <div class="time">5:37</div>
    </nav>
    <div class="content">
        <div class="map">
            <svg viewBox="0 0 1920 1024" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="city-selected">
                        <stop style="stop-color:#83824b" offset="0" />
                        <stop style="stop-color:#c4c498" offset="1" />
                    </linearGradient>
                    <linearGradient id="city-available">
                        <stop style="stop-color:#52834b" offset="0" />
                        <stop style="stop-color:#9dc498" offset="1" />
                    </linearGradient>
                    <linearGradient id="city-default">
                        <stop style="stop-color:#4b7183" offset="0" />
                        <stop style="stop-color:#98b6c4" offset="1" />
                    </linearGradient>
                </defs>
                <line id="path-1-2" x1="400" y1="600" x2="500" y2="500" style="stroke:#ccc;stroke-width:5px;" />
                <line id="path-2-3" x1="300" y1="400" x2="400" y2="370" style="stroke:#ccc;stroke-width:5px;" />
                <line id="path-3-4" x1="300" y1="400" x2="500" y2="500" style="stroke:#ccc;stroke-width:5px;" />
                <circle id="city-1" cx="400" cy="600" r="20"
                    style="fill:#757575;stroke:url(#city-default);stroke-width:5px" />
                <circle id="city-2" cx="500" cy="500" r="20"
                    style="fill:#757575;stroke:url(#city-available);stroke-width:5px" />
                <circle id="city-3" cx="300" cy="400" r="20"
                    style="fill:#757575;stroke:url(#city-selected);stroke-width:5px" />
                <circle id="city-4" cx="400" cy="370" r="20"
                    style="fill:#757575;stroke:url(#city-available);stroke-width:5px" />
                <rect id="darkness" x="0" y="0" width="1920" height="1024" style="fill:#000;fill-opacity: 0.8;" />
                <use xlink:href="#path-3-4" />
                <use xlink:href="#path-2-3" />
                <use xlink:href="#city-2" />
                <use xlink:href="#city-3" />
                <use xlink:href="#city-4" />
            </svg>
        </div>
    </div>
    <div class="modalContainer" style="display: none;">
        <div class="armySelect">
            <h2>Armáda</h2>
            <div class="selectRange">
                <div class="selectSlider"></div>
            </div>
            <div class="count">
                <div class="amount">12</div>
                <button class="incr"><i class="fa fa-caret-up"></i></button>
                <button class="decr"><i class="fa fa-caret-down"></i></button>
            </div>
        </div>
    </div>
</body>

</html>
