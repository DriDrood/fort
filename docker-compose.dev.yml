version: "3"
services:
  frontend:
    build: frontend
    restart: "no"
    ports:
      - "80:80"
    volumes:
      - ./frontend/nginx:/etc/nginx/conf.d
    depends_on:
      - backend
  backend:
    build: Fort
    restart: "no"
    depends_on:
      - db
  db:
    image: "mariadb:10.3"
    restart: "no"
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "makamakatoto68"
      MYSQL_USER: "fort"
      MYSQL_PASSWORD: "heblebletunato68"
volumes:
  dbdata: